[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skillprobe"
version = "0.1.0"
description = "Eval harness for agent skills (SKILL.md): does the skill trigger when it should, and does the agent follow it - across OpenAI, Qwen, DeepSeek, GLM, Kimi and any OpenAI-compatible model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Andrey Sukhanov" }]
keywords = ["llm", "evals", "agent-skills", "claude-code", "prompt-engineering"]
dependencies = [
  "openai>=1.40",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  "jsonschema>=4.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
skillprobe = "skillprobe.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["skillprobe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
